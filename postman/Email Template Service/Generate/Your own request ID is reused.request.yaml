$kind: http-request
url: "{{baseUrl}}/api/email-templates"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: X-Request-Id
    value: postman-demo-0001
    description: Find this ID in storage/logs/ai.log to see the AI call's response time.
body:
  type: text
  content: |-
    {
      "purpose": "Thank the customer for their first order",
      "recipient_name": "Meera",
      "tone": "friendly"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('X-Request-Id echoes the one sent', () => pm.response.to.have.header('X-Request-Id', 'postman-demo-0001'));
      if (pm.response.code === 200) {
          pm.test('meta.request_id echoes the one sent', () => pm.expect(pm.response.json().meta.request_id).to.eql('postman-demo-0001'));
      }
    language: text/javascript
order: 6000
