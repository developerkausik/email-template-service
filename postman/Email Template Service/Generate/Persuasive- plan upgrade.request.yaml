$kind: http-request
name: "Persuasive: plan upgrade"
url: "{{baseUrl}}/api/email-templates"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "purpose": "Encourage the customer to upgrade to the annual plan and save 20%",
      "recipient_name": "Ankit",
      "tone": "persuasive"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
