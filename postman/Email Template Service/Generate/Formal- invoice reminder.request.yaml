$kind: http-request
name: "Formal: invoice reminder"
url: "{{baseUrl}}/api/email-templates"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "purpose": "Remind the customer that their invoice is due in 5 days",
      "recipient_name": "Ms. Banerjee",
      "tone": "formal"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
