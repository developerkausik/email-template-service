$kind: http-request
name: "Neutral: maintenance notice"
url: "{{baseUrl}}/api/email-templates"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "purpose": "Notify about scheduled maintenance this Sunday from 2 to 4 AM",
      "recipient_name": "Sneha",
      "tone": "neutral"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
