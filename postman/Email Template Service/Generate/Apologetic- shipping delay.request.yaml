$kind: http-request
name: "Apologetic: shipping delay"
url: "{{baseUrl}}/api/email-templates"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "purpose": "Inform about a 2-day shipping delay",
      "recipient_name": "Priya",
      "tone": "apologetic"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
